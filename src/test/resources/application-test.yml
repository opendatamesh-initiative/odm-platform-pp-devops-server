spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      hibernate:
        show_sql: false
        default_schema: odm_devops_test
        dialect: org.hibernate.dialect.PostgreSQLDialect

odm:
  product-plane:
    notification-service:
      address: http://localhost:8001
      active: false
  utility-plane:
    executors:
      polling-interval: 1ms
      secrets-ttl: 1h
      services:
        starter:
          address: http://localhost:9080
          execution-mode: full-control
        cli:
          address: http://localhost:9081
          execution-mode: instrumented