server:
  port: 8080
  baseUrl: http://localhost:8080

devops:
  observer:
    name: devops
    displayName: DevOps

odm:
  product-plane:
    notification-service:
      address: http://localhost:8001
      active: false
    policy-service:
      active: false
  utility-plane:
    executor-polling:
      interval: 30s
    executor-secrets:
      ttl: 1h
    executor-services: {}

spring:
  profiles:
    active: test
  application:
    name: odm-platform-pp-devops-server
  banner:
    charset: UTF-8
    mode: console
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql
  jpa:
    properties:
      hibernate:
        default_schema: odm_devops
        ddl-auto: validate
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100

info:
  version: @project.version@
  name: @project.name@

application:
  title: ODM Platform DevOps Server

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
