server:
  port: 8080
  baseUrl: http://localhost:8080

devops:
  observer:
    name: devops
    displayName: DevOps

odm:
  product-plane:
    notification-service:
      active: false
      address: http://localhost:8001
    policy-service:
      # With active=true and no version, an external Policy service publishes decisions on Notification.
      # Set version: 1 (and address) only to have DevOps call a Policy service V1 itself.
      active: false
  utility-plane:
    executors:
      polling-interval: 30s
      secrets-ttl: 1h

spring:
  application:
    name: odm-platform-pp-devops-server
  banner:
    charset: UTF-8
    mode: console
  flyway:
    enabled: true
    baseline-on-migrate: true
  threads:
    virtual:
      # Notifications run on the async executor and a full-control task waits on it for its whole run:
      # virtual threads keep a long run from holding one of a few platform threads.
      enabled: true
  jpa:
    # Use cases manage their own transactions; a request must not keep a database connection while it waits.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: odm_devops

info:
  version: @project.version@
  name: @project.name@

application:
  title: ODM Platform DevOps Server

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
